name: Teste MP4 (PyAV)

on:
  push:
    branches: [mp4]
  workflow_dispatch:

jobs:
  mp4:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar
        run: pip install "av==11.0.0" pillow numpy
      - name: Testar o MP4 com audio
        run: python -m unittest tests.test_mp4 -v
