name: Teste MP4 (PyAV)

on:
  push:
    branches: [mp4]
  workflow_dispatch:

jobs:
  mp4:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ffmpeg libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
          pip install "cython==0.29.36" pillow numpy
          pip install --no-build-isolation "av==10.0.0"
      - name: Testar o MP4 com audio
        run: python -m unittest tests.test_mp4 -v
